services:
  agro-price-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agro-price-forecast-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload